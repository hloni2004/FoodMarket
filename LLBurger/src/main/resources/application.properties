# SPRING SECURITY + JWT
# âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
# Must be at least 32 bytes (256 bits) for HS256 â change in production!
jwt.secret=${JWT_SECRET:llburgers-super-secret-jwt-signing-key-for-authentication-2026-very-secure}
# Access token TTL: 15 minutes (milliseconds)
jwt.access-token.expiration-ms=900000
# Refresh token TTL: 7 days (milliseconds)
jwt.refresh-token.expiration-ms=604800000

# âââ Brute-force / Rate Limiting âââââââââââââââââââââââââââââââââââââââââââââ
security.login.max-attempts=5
security.login.lock-duration-minutes=15

# âââ CORS: comma-separated origins that the browser is allowed to talk from ââ
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}

# âââ Frontend URL (used for password-reset links in emails) ââââââââââââââââââ
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ???????????????????????????????????????????????????????????????????????????????
# EMAIL PROVIDER 1: BREVO (Welcome emails + Business notifications)
# ???????????????????????????????????????????????????????????????????????????????
mail.sender1.host=${BREVO_HOST:smtp-relay.brevo.com}
mail.sender1.port=${BREVO_PORT:587}
mail.sender1.username=${BREVO_USERNAME:}
mail.sender1.password=${BREVO_PASSWORD:}
mail.sender1.from=${BREVO_FROM:noreply@llburgers.com}
mail.sender1.properties.mail.smtp.auth=true
mail.sender1.properties.mail.smtp.starttls.enable=true

# ???????????????????????????????????????????????????????????????????????????????
# EMAIL PROVIDER 2: MAILJET (Order confirmations + Status updates)
# ???????????????????????????????????????????????????????????????????????????????
spring.mail.host=${MAILJET_HOST:in-v3.mailjet.com}
spring.mail.port=${MAILJET_PORT:587}
spring.mail.username=${MAILJET_USERNAME:}
spring.mail.password=${MAILJET_PASSWORD:}
spring.mail.from=${MAILJET_FROM:orders@llburgers.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ???????????????????????????????????????????????????????????????????????????????
# WEBSOCKET (Real-time push via STOMP + SockJS)
# ???????????????????????????????????????????????????????????????????????????????
# Connect endpoint:  ws://host/ws   (or http://host/ws for SockJS fallback)
# Subscribe topics:
#   /topic/orders              â admin order feed (all order events)
#   /topic/order/{orderId}     â customer order tracker (per-order events)
#   /topic/business            â business open/close broadcast
# Application prefix (client â server):  /app
# User queue prefix:  /user
websocket.endpoint=/ws
websocket.topic.orders=/topic/orders
websocket.topic.order=/topic/order
websocket.topic.business=/topic/business

# ???????????????????????????????????????????????????????????????????????????????
# LOGGING
# ???????????????????????????????????????????????????????????????????????????????
# Debug email sending â check console for [EMAIL-SENT] / [EMAIL-FAILED] / [EMAIL-RETRY]
logging.level.com.llburgers=DEBUG
logging.level.org.springframework.mail=DEBUG

