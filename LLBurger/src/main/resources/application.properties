# ???????????????????????????????????????????????????????????????????????????????
# APPLICATION
# ???????????????????????????????????????????????????????????????????????????????
spring.application.name=LLBurger

# âââ Multipart File Upload Limits ââââââââââââââââââââââââââââââââââââââââââââ
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ???????????????????????????????????????????????????????????????????????????????
# SUPABASE DATABASE (PostgreSQL)
# Use the SESSION POOLER URL from Supabase Dashboard > Settings > Database > Connection Pooling
# Session mode (port 5432) is required for HikariCP - do NOT use Transaction mode (port 6543)
# Session pooler URL format: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
# ???????????????????????????????????????????????????????????????????????????????
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/llburgers}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ??? Connection Pooling (HikariCP) ????????????????????????????????????????????
# Max 50 simultaneous connections as per documentation
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ??? JPA / Hibernate ??????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ???????????????????????????????????????????????????????????????????????????????
# SUPABASE STORAGE (Image Uploads)
# Bucket : llburger-images  ? create this bucket in Supabase (see instructions)
# Subfolders used by the app (created automatically on first upload):
#   products/   ? burger / drink / sauce images
#   sides/      ? side-dish images
#   extras/     ? extra (cheese, bacon, etc.) images
# The key below must be your project's SERVICE ROLE key (not the anon key).
# ???????????????????????????????????????????????????????????????????????????????
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:llburger-images}

# ???????????????????????????????????????????????????????????????????????????????
# REDIS (Caching Layer)
# Frequently read data: product catalog, stock levels, notifications
# Upstash Cloud Redis Configuration
# ???????????????????????????????????????????????????????????????????????????????
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=redis

# ???????????????????????????????????????????????????????????????????????????????
# RABBITMQ (Queue-Based Order & Email Processing)
# Orders and emails are queued and processed asynchronously
# CloudAMQP Configuration
# ???????????????????????????????????????????????????????????????????????????????
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# âââ Queue / Exchange Names ââââââââââââââââââââââââââââââââââââââââââââââââââââ
rabbitmq.exchange=llburger.exchange
rabbitmq.dlx=llburger.dlx
rabbitmq.queues.order-placed=llburger.orders.placed
rabbitmq.queues.order-status-changed=llburger.orders.status-changed
rabbitmq.queues.order-cancelled=llburger.orders.cancelled
rabbitmq.queues.business-opened=llburger.business.opened
rabbitmq.queues.business-closed=llburger.business.closed
rabbitmq.queues.dead-letter=llburger.dead-letter

# âââ Listener Container ââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=30000

